name: Build APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # No wrapper jar is committed, so Gradle is provided by the action instead.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # Absent secrets are not an error: the build still produces an APK, it is just
      # signed with the debug key and will not upgrade an existing install in place.
      - name: Decode keystore
        id: keystore
        env:
          KEYSTORE_B64: ${{ secrets.CAIRN_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/cairn.jks"
            echo "path=$RUNNER_TEMP/cairn.jks" >> "$GITHUB_OUTPUT"
            echo "Keystore decoded."
          else
            echo "No keystore secret set, building unsigned."
          fi

      - name: Build release APK
        env:
          CAIRN_BUILD: ${{ github.run_number }}
          CAIRN_KEYSTORE: ${{ steps.keystore.outputs.path }}
          CAIRN_STORE_PASSWORD: ${{ secrets.CAIRN_STORE_PASSWORD }}
          CAIRN_KEY_ALIAS: ${{ secrets.CAIRN_KEY_ALIAS }}
          CAIRN_KEY_PASSWORD: ${{ secrets.CAIRN_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Name the APK
        id: apk
        run: |
          SRC=$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)
          DEST="cairn-${{ github.run_number }}.apk"
          cp "$SRC" "$DEST"
          echo "path=$DEST" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: cairn-apk
          path: ${{ steps.apk.outputs.path }}

      # The updater reads the digits out of the tag, so tags must look like v12.
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: v${{ github.run_number }}
          files: ${{ steps.apk.outputs.path }}
          generate_release_notes: true
